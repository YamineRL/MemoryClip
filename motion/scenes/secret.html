<!doctype html><meta charset="utf-8"><title>secret</title>
<link rel="stylesheet" href="../kit/kit.css"><div id="stage"></div>
<script type="module">
import { clips, loadFixtures, buildPanel, put, slotX, keycaps, prog, ease, $ } from '../kit/kit.js';
const fx = await loadFixtures();
Motion.duration = 8;
Motion.size(480);
const P = buildPanel(fx, { clipIds: ['token', 'address', 'booking', 'dinner', 'rechta'] });
const sheet = document.createElement('div'); sheet.id = 'sheet';
sheet.innerHTML = `<div class="fp">◎</div><div>${fx.secret.prompt}</div>`; $('#stage').append(sheet);
const cap = keycaps(['Return']);
const tok = P.cards[0];
Motion.at((t) => {
  const a = Math.min(prog(t, 0.2, 0.8, ease.out), 1 - prog(t, 7.4, 7.9));
  P.panel.style.opacity = a; P.panel.style.transform = `translateY(${(1 - a) * 22}px)`;
  P.cards.forEach((c, i) => { const k = prog(t, 0.4 + i * 0.08, 1.0 + i * 0.08, ease.back); put(c, { x: slotX(i), y: (1 - k) * 18, o: k, sel: i === 0 ? 1 : 0 }); });
  const revealed = t >= 4.0 && t < 6.4;
  tok._.mask.textContent = revealed ? fx.clips.token.secret : fx.secret.mask;
  tok._.mask.style.fontSize = revealed ? '13px' : '16px'; tok._.mask.style.letterSpacing = revealed ? '0' : '3px';
  cap(t, 1.8, 2.8, 2.2);
  const s = Math.min(prog(t, 2.4, 2.8, ease.out), 1 - prog(t, 3.9, 4.2));
  sheet.style.opacity = s; sheet.style.transform = `scale(${0.94 + 0.06 * s})`;
  const pulse = (Math.sin(t * 9) + 1) / 2;
  sheet.querySelector('.fp').style.boxShadow = `0 0 ${6 + pulse * 18}px rgba(10,132,255,${0.3 + pulse * 0.4})`;
  P.count.textContent = '8 clips';
});
window.__ready = true;
</script>
