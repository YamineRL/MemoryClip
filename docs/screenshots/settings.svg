<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="620" height="500" rx="12" fill="#1e1e20"/>

  <!-- title bar -->
  <path d="M0 12 A12 12 0 0 1 12 0 H608 A12 12 0 0 1 620 12 V40 H0 Z" fill="#2a2a2c"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text x="310" y="25" fill="#e8e8ea" font-size="13" font-weight="600" text-anchor="middle">MemoryClip Settings</text>

  <!-- sidebar -->
  <path d="M0 40 H164 V500 H12 A12 12 0 0 1 0 488 Z" fill="#252527"/>
  <rect x="10" y="76" width="144" height="26" rx="6" fill="#3a3a3d"/>
  <g font-size="10" font-weight="600" fill="#98989d">
    <text x="18" y="64">General</text>
    <text x="18" y="148">Clipboard</text>
    <text x="18" y="260">Screenshots</text>
  </g>
  <g font-size="12" fill="#d6d6da">
    <text x="44" y="93" fill="#f2f2f7" font-weight="600">General</text>
    <text x="44" y="121">Shortcuts</text>
    <text x="44" y="177">History</text>
    <text x="44" y="205">Panel</text>
    <text x="44" y="233">Privacy</text>
    <text x="44" y="289">Screenshots</text>
    <text x="44" y="317">Notes</text>
    <text x="44" y="369">Translation</text>
    <text x="44" y="421">About</text>
  </g>
  <!-- sidebar glyph tiles -->
  <g>
    <rect x="18" y="80" width="18" height="18" rx="5" fill="#8e8e93"/>
    <rect x="18" y="108" width="18" height="18" rx="5" fill="#0a84ff"/>
    <rect x="18" y="164" width="18" height="18" rx="5" fill="#ff9f0a"/>
    <rect x="18" y="192" width="18" height="18" rx="5" fill="#bf5af2"/>
    <rect x="18" y="220" width="18" height="18" rx="5" fill="#ff375f"/>
    <rect x="18" y="276" width="18" height="18" rx="5" fill="#30d158"/>
    <rect x="18" y="304" width="18" height="18" rx="5" fill="#40c8e0"/>
    <rect x="18" y="356" width="18" height="18" rx="5" fill="#ac8e68"/>
    <rect x="18" y="408" width="18" height="18" rx="5" fill="#5e5ce6"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- gearshape -->
    <circle cx="27" cy="89" r="4"/><circle cx="27" cy="89" r="1.4"/>
    <!-- keyboard -->
    <rect x="21.5" y="113.2" width="11" height="7.6" rx="1.6"/><path d="M24.4 118.6 H29.6"/>
    <!-- clock.arrow.circlepath -->
    <circle cx="27" cy="173" r="4.2"/><path d="M27 170.6 V173 H28.8"/>
    <!-- rectangle.on.rectangle -->
    <rect x="21.8" y="196.4" width="7.4" height="6" rx="1.2"/><rect x="24.8" y="199.6" width="7.4" height="6" rx="1.2"/>
    <!-- lock.shield -->
    <rect x="23.6" y="227.8" width="6.8" height="5.4" rx="1.2"/><path d="M25 227.8 V226.2 a2 2 0 0 1 4 0 V227.8"/>
    <!-- camera.viewfinder -->
    <path d="M21.6 282.4 V280.8 H23.2"/><path d="M30.8 280.8 H32.4 V282.4"/><path d="M32.4 287.6 V289.2 H30.8"/><path d="M23.2 289.2 H21.6 V287.6"/>
    <circle cx="27" cy="285" r="1.9"/>
    <!-- note.text -->
    <rect x="22.8" y="308.2" width="8.4" height="9.6" rx="1.5"/><path d="M25 311.4 H29"/><path d="M25 314.2 H29"/>
    <!-- character.bubble -->
    <rect x="21.4" y="359.6" width="11.2" height="7.6" rx="2.2"/><path d="M24.4 367.2 V370 L27.2 367.2"/>
    <path d="M24.8 365.4 L27 360.9 L29.2 365.4"/><path d="M25.6 363.9 H28.4"/>
    <!-- info.circle -->
    <circle cx="27" cy="417" r="4.2"/><path d="M27 414.7 v0.3"/><path d="M27 416.3 v3"/>
  </g>
  <line x1="164" y1="40" x2="164" y2="500" stroke="#333335"/>

  <!-- pane header -->
  <rect x="164" y="40" width="456" height="52" fill="#252527"/>
  <line x1="164" y1="92" x2="620" y2="92" stroke="#333335"/>
  <rect x="188" y="52" width="24" height="24" rx="6" fill="#8e8e93"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <circle cx="200" cy="64" r="5.4"/><circle cx="200" cy="64" r="1.9"/>
  </g>
  <text x="222" y="70" fill="#f2f2f7" font-size="15" font-weight="600">General</text>

  <!-- Startup -->
  <text x="194" y="126" fill="#f2f2f7" font-size="13.5" font-weight="700">Startup</text>
  <rect x="188" y="138" width="408" height="94" rx="12" fill="#26262a"/>
  <rect x="206" y="159" width="18" height="18" rx="5" fill="#30d158"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round">
    <path d="M215 163.8 V166.8"/><path d="M212.1 165.8 a4 4 0 1 0 5.8 0"/>
  </g>
  <text x="232" y="173" fill="#f2f2f7" font-size="14">Launch at login</text>
  <rect x="524" y="155" width="52" height="26" rx="13" fill="#4a4a4e"/><circle cx="537" cy="168" r="10" fill="#f7f7f8"/>
  <line x1="206" y1="188" x2="578" y2="188" stroke="#333338"/>
  <text x="206" y="207" fill="#98989d" font-size="11.5">MemoryClip runs as a menu-bar app: no Dock icon, no window until</text>
  <text x="206" y="221" fill="#98989d" font-size="11.5">you open the panel.</text>

  <!-- Appearance -->
  <text x="194" y="266" fill="#f2f2f7" font-size="13.5" font-weight="700">Appearance</text>
  <rect x="188" y="278" width="408" height="94" rx="12" fill="#26262a"/>
  <rect x="206" y="299" width="18" height="18" rx="5" fill="#5e5ce6"/>
  <path d="M215 303.8 A4.2 4.2 0 0 0 215 312.2 Z" fill="#ffffff"/>
  <circle cx="215" cy="308" r="4.2" fill="none" stroke="#ffffff" stroke-width="1.3"/>
  <text x="232" y="313" fill="#f2f2f7" font-size="14">Theme</text>
  <rect x="392" y="294" width="184" height="28" rx="8" fill="#3a3a3d"/>
  <rect x="394" y="296" width="60" height="24" rx="6" fill="#5a5a5f"/>
  <g font-size="12" text-anchor="middle"><text x="424" y="312" fill="#fff">System</text><text x="486" y="312" fill="#d6d6da">Light</text><text x="546" y="312" fill="#d6d6da">Dark</text></g>
  <line x1="206" y1="328" x2="578" y2="328" stroke="#333338"/>
  <text x="206" y="347" fill="#98989d" font-size="11.5">Applies to the clipboard panel and every MemoryClip window.</text>
  <text x="206" y="361" fill="#98989d" font-size="11.5">"System" follows your macOS Appearance setting.</text>

  <!-- Pasting -->
  <text x="194" y="406" fill="#f2f2f7" font-size="13.5" font-weight="700">Pasting</text>
  <rect x="188" y="418" width="408" height="58" rx="12" fill="#26262a"/>
  <rect x="206" y="439" width="18" height="18" rx="5" fill="#0a84ff"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="211.6" y="447.4" width="6.8" height="5.4" rx="1.2"/>
    <path d="M215 443.4 V446.4"/><path d="M213.4 445 L215 446.5 L216.6 445"/>
  </g>
  <text x="232" y="453" fill="#f2f2f7" font-size="14">Paste automatically after selecting a clip</text>
  <rect x="524" y="435" width="52" height="26" rx="13" fill="#1d6bf0"/><circle cx="563" cy="448" r="10" fill="#fff"/>

  <rect x="0.5" y="0.5" width="619" height="499" rx="11.5" fill="none" stroke="#333335"/>
</svg>
