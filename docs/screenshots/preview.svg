<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/><stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="28" fill="url(#pane)"/>
  <rect x="0.5" y="0.5" width="719" height="299" rx="27.5" fill="none" stroke="#2c2c2e"/>

  <!-- header -->
  <rect x="24" y="24" width="26" height="26" rx="6" fill="#1d6bf0"/>
  <path d="M31 37 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="36" fill="#f2f2f7" font-size="15" font-weight="600">Xcode</text>
  <text x="60" y="52" fill="#8e8e93" font-size="12.5">21 minutes ago · 74 characters</text>

  <!-- detection badges -->
  <g font-size="11.5" font-weight="600">
