    <rect x="620" y="24" width="76" height="22" rx="11" fill="#2a2320"/>
    <circle cx="633" cy="35" r="3.5" fill="#ff9f0a"/>
    <text x="641" y="39" fill="#ffcf80">Rich text</text>
  </g>

  <!-- content -->
  <rect x="24" y="68" width="672" height="150" rx="16" fill="#1c1c1e"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="44" y="96" fill="#8e8e93">{</text>
    <text x="60" y="118" fill="#7ec8ff">"id"</text><text x="92" y="118" fill="#8e8e93">:</text><text x="102" y="118" fill="#ffd479">4821</text><text x="136" y="118" fill="#8e8e93">,</text>
    <text x="60" y="140" fill="#7ec8ff">"name"</text><text x="108" y="140" fill="#8e8e93">:</text><text x="118" y="140" fill="#a8e6a1">"Ada Lovelace"</text><text x="230" y="140" fill="#8e8e93">,</text>
    <text x="60" y="162" fill="#7ec8ff">"roles"</text><text x="116" y="162" fill="#8e8e93">: [</text><text x="140" y="162" fill="#a8e6a1">"admin"</text><text x="196" y="162" fill="#8e8e93">,</text><text x="206" y="162" fill="#a8e6a1">"author"</text><text x="270" y="162" fill="#8e8e93">],</text>
    <text x="60" y="184" fill="#7ec8ff">"active"</text><text x="124" y="184" fill="#8e8e93">:</text><text x="134" y="184" fill="#ff8b8b">true</text>
    <text x="44" y="206" fill="#8e8e93">}</text>
  </g>

  <!-- actions -->
  <g font-size="12.5" font-weight="500">
    <rect x="24" y="238" width="104" height="30" rx="10" fill="#2c2c2e"/>
    <text x="76" y="257" fill="#e8e8ea" text-anchor="middle">Format JSON</text>
    <rect x="136" y="238" width="76" height="30" rx="10" fill="#2c2c2e"/>
