<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" width="620" height="470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <rect width="620" height="470" rx="12" fill="#1e1e20"/>
  <rect x="0.5" y="0.5" width="619" height="469" rx="11.5" fill="none" stroke="#333335"/>

  <!-- title bar -->
  <path d="M0 12 A12 12 0 0 1 12 0 H608 A12 12 0 0 1 620 12 V40 H0 Z" fill="#2a2a2c"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text x="310" y="25" fill="#e8e8ea" font-size="13" font-weight="600" text-anchor="middle">MemoryClip Settings</text>

  <!-- tab strip -->
  <rect x="0" y="40" width="620" height="52" fill="#252527"/>
  <line x1="0" y1="92" x2="620" y2="92" stroke="#333335"/>
  <rect x="14" y="48" width="96" height="36" rx="8" fill="#3a3a3d"/>
  <g font-size="11" text-anchor="middle">
    <g fill="#f2f2f7"><text x="62" y="78" font-weight="600">General</text></g>
    <g fill="#9a9a9e">
      <text x="164" y="78">History</text>
      <text x="264" y="78">Panel</text>
      <text x="360" y="78">Privacy</text>
      <text x="460" y="78">Shortcuts</text>
      <text x="560" y="78">About</text>
    </g>
  </g>
  <g fill="none" stroke-width="1.6" stroke-linecap="round">
    <circle cx="62" cy="60" r="6" stroke="#f2f2f7"/><circle cx="62" cy="60" r="2" stroke="#f2f2f7"/>
    <circle cx="164" cy="60" r="6.5" stroke="#9a9a9e"/><path d="M164 57 v3.5 l2.5 2" stroke="#9a9a9e"/>
    <rect x="257" y="54" width="10" height="8" rx="1.5" stroke="#9a9a9e"/><rect x="261" y="58" width="10" height="8" rx="1.5" stroke="#9a9a9e"/>
    <rect x="354" y="57" width="12" height="9" rx="2" stroke="#9a9a9e"/><path d="M356.5 57 v-2.5 a3.5 3.5 0 0 1 7 0 V57" stroke="#9a9a9e"/>
    <rect x="452" y="54" width="16" height="11" rx="2" stroke="#9a9a9e"/>
    <circle cx="560" cy="60" r="6.5" stroke="#9a9a9e"/><path d="M560 57 v0.5 M560 60 v3.5" stroke="#9a9a9e"/>
  </g>

  <!-- Startup -->
  <text x="30" y="126" fill="#f2f2f7" font-size="13.5" font-weight="700">Startup</text>
  <rect x="24" y="138" width="572" height="76" rx="12" fill="#26262a"/>
  <text x="42" y="168" fill="#f2f2f7" font-size="14">Launch at login</text>
  <rect x="524" y="155" width="52" height="26" rx="13" fill="#4a4a4e"/><circle cx="537" cy="168" r="10" fill="#f7f7f8"/>
  <line x1="42" y1="184" x2="578" y2="184" stroke="#333338"/>
  <text x="42" y="203" fill="#98989d" font-size="11.5">MemoryClip runs as a menu-bar app: no Dock icon, no window until you open the panel.</text>

  <!-- Appearance -->
  <text x="30" y="248" fill="#f2f2f7" font-size="13.5" font-weight="700">Appearance</text>
  <rect x="24" y="260" width="572" height="90" rx="12" fill="#26262a"/>
  <text x="42" y="292" fill="#f2f2f7" font-size="14">Theme</text>
  <rect x="392" y="278" width="184" height="28" rx="8" fill="#3a3a3d"/>
  <rect x="394" y="280" width="60" height="24" rx="6" fill="#5a5a5f"/>
  <g font-size="12" text-anchor="middle"><text x="424" y="296" fill="#fff">System</text><text x="486" y="296" fill="#d6d6da">Light</text><text x="546" y="296" fill="#d6d6da">Dark</text></g>
  <line x1="42" y1="312" x2="578" y2="312" stroke="#333338"/>
  <text x="42" y="331" fill="#98989d" font-size="11.5">Applies to the clipboard panel and every MemoryClip window. "System" follows your macOS</text>
  <text x="42" y="345" fill="#98989d" font-size="11.5">Appearance setting.</text>

  <!-- Pasting -->
  <text x="30" y="384" fill="#f2f2f7" font-size="13.5" font-weight="700">Pasting</text>
  <rect x="24" y="396" width="572" height="58" rx="12" fill="#26262a"/>
  <text x="42" y="430" fill="#f2f2f7" font-size="14">Paste automatically after selecting a clip</text>
  <rect x="524" y="417" width="52" height="26" rx="13" fill="#1d6bf0"/><circle cx="563" cy="430" r="10" fill="#fff"/>
</svg>
